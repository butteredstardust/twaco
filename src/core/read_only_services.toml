# Platform services that only read, so MCP `call` runs them without `dry_run: false`.
#
# Generated once from the ThingWorx 10.1.0 Javadoc member index
# (https://support.ptc.com/help/thingworx_hc/javadoc/member-search-index.js): the PascalCase
# service methods named Get*, Query*, Search*, Find*, Is* or Has* of the classes behind each
# collection or Resource, and every InfoTableFunctions function (each returns a new table).
# Reviewed by hand: ContentLoaderFunctions (it reaches other hosts), remote-thing services (they
# reach the device), ApplicationKey GetKeyID (it returns the secret) and the configuration
# table reads (a PASSWORD column may come back readable) are left out.
# A service the repository defines or overrides is never taken from this list.

# Every entity has these (RootEntity).
