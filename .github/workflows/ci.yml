name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Crash-recovery tests
        run: cargo test --locked --features test-failpoints -- transaction crash
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Usage text and COMMANDS.md agree
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/commands_doc.py
          git diff --exit-code documentation/COMMANDS.md
