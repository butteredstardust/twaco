name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Crash-recovery tests
        run: cargo test --locked --features test-failpoints -- transaction crash
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Usage text and COMMANDS.md agree
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/commands_doc.py
          git diff --exit-code documentation/COMMANDS.md

  # The version that package.yml checks Cargo.toml against.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Build every release package and install it, as the release does. The test job already ran
  # the tests.
  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      test: false
      retention-days: 1
