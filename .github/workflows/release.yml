name: Release

# Push a tag such as v0.1.0 whose version matches Cargo.toml. Each platform is built and
# tested, and the archives are attached to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gates as CI, because a tag can point at a commit CI never saw.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check
      # Builds the crate from the files `cargo package` would publish, so a template or knowledge
      # topic that the binary embeds but the package leaves out fails here, not for a user.
      - name: The package builds from its own files
        run: cargo package --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Usage text and COMMANDS.md agree
        run: |
          cargo build --locked
          python3 scripts/commands_doc.py
          git diff --exit-code documentation/COMMANDS.md

  build:
    needs: gates
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: The tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="twaco-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/twaco.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/twaco" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      # Run what a user would download, not the build tree: unpack the archive into a clean
      # directory, check it reports the tagged version, and check the knowledge topics compiled
      # into it are there (they need no solution and no server).
      - name: Smoke-run the packaged binary
        shell: bash
        run: |
          name="${ASSET%.zip}"
          name="${name%.tar.gz}"
          mkdir smoke
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z x "$ASSET" -osmoke > /dev/null
            exe=twaco.exe
          else
            tar -xzf "$ASSET" -C smoke
            exe=twaco
          fi
          cd smoke
          got=$("./$name/$exe" --version)
          want="twaco ${GITHUB_REF_NAME#v}"
          if [ "$got" != "$want" ]; then
            echo "the packaged binary says '$got', expected '$want'" >&2
            exit 1
          fi
          topics=$("./$name/$exe" guide)
          for topic in workflow quirks service-code; do
            echo "$topics" | grep -q "^$topic " || { echo "guide topic $topic is missing from the packaged binary" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Every platform's archive is here
        run: |
          for pattern in 'twaco-*-x86_64-pc-windows-msvc.zip' 'twaco-*-x86_64-unknown-linux-gnu.tar.gz' 'twaco-*-aarch64-apple-darwin.tar.gz'; do
            ls assets/$pattern > /dev/null || { echo "no archive matching $pattern" >&2; exit 1; }
          done
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || index($0, "[") == 1) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "twaco $version" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: assets/*
