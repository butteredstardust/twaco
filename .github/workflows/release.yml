name: Release

# Every push to main that changes what ships publishes a release:
#   1. prepare: run the gates, then commit the new version to a temporary release/vX branch.
#   2. build: build, test and package each platform from that commit. Smoke-run every installer.
#   3. publish: sign the archives, fast-forward main to the version commit, and create the release.
# main receives the version commit only after every platform builds. To recover from a failed
# job, use "Re-run failed jobs": each job can run again. A run where a v* tag already points at
# main does nothing.
#
# scripts/release_version.py chooses the version. To release a minor or major version, set it in
# Cargo.toml and Cargo.lock by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Changes that reach neither the binary nor a release asset do not release. The archives
    # include README.md, LICENSE and CHANGELOG.md, but a change to them alone waits for the next
    # release. knowledge/*.md is compiled into the binary, so only Markdown at the root is listed.
    paths-ignore:
      - "*.md"
      - "documentation/**"
      - "assets/icon/*.svg"
      - "assets/icon/*.icns"
      - "LICENSE"
      - ".gitignore"
      - ".git-blame-ignore-revs"

# One release at a time, and none cancelled halfway. GitHub keeps only the newest waiting run, so
# runs coalesce: a run checks out main when it starts, and releases every commit before it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.head.outputs.skip }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      # A run that waited while an earlier run released main has nothing left to release: a
      # release tag already points at main.
      - id: head
        run: |
          tags=$(git tag --points-at HEAD --list 'v*')
          if [ -n "$tags" ]; then
            echo "main is already released as $tags"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: steps.head.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - name: Clippy
        if: steps.head.outputs.skip != 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Formatting
        if: steps.head.outputs.skip != 'true'
        run: cargo fmt --all --check
      # Builds the crate from the files `cargo package` would publish, so a template or knowledge
      # topic that the binary embeds but the package leaves out fails here, not for a user.
      - name: The package builds from its own files
        if: steps.head.outputs.skip != 'true'
        # rust-cache cannot clean target/package, so remove it here.
        run: |
          cargo package --locked
          rm -rf target/package
      - if: steps.head.outputs.skip != 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Usage text and COMMANDS.md agree
        if: steps.head.outputs.skip != 'true'
        run: |
          cargo build --locked
          python3 scripts/commands_doc.py
          git diff --exit-code documentation/COMMANDS.md
      - name: Release script tests
        if: steps.head.outputs.skip != 'true'
        run: python3 -m unittest discover -s scripts
      - name: Choose and write the version
        id: bump
        if: steps.head.outputs.skip != 'true'
        run: echo "version=$(python3 scripts/release_version.py)" >> "$GITHUB_OUTPUT"
      - name: The lockfile still resolves
        if: steps.head.outputs.skip != 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      # A push with GITHUB_TOKEN starts no workflow, so this branch does not release itself.
      - name: Commit to release/v${{ steps.bump.outputs.version }}
        id: commit
        if: steps.head.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release v$VERSION [skip ci]"
          git push --force origin "HEAD:refs/heads/release/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    name: build (${{ matrix.target }})
    strategy:
      # Every leg runs to the end, so one failure does not cancel the others. "Re-run failed jobs"
      # then reruns only the legs that failed.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # The oldest supported Ubuntu runner: the binary, the .deb and the AppImage need at
          # least the glibc that built them.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Cargo.toml has the version being released
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$VERSION" ]; then
            echo "Cargo.toml says $version, the release is $VERSION" >&2
            exit 1
          fi
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          name="twaco-$VERSION-${{ matrix.target }}"
          mkdir "$name" dist
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/twaco.exe" "$name/"
            7z a "dist/$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/twaco" "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      # Run what a user would download, not the build tree: unpack the archive into a clean
      # directory, check it reports the released version, and check the knowledge topics compiled
      # into it are there (they need no solution and no server).
      - name: Smoke-run the archived binary
        shell: bash
        run: |
          name=$(basename "$ASSET")
          name="${name%.zip}"
          name="${name%.tar.gz}"
          mkdir smoke
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z x "$ASSET" -osmoke > /dev/null
            exe=twaco.exe
          else
            tar -xzf "$ASSET" -C smoke
            exe=twaco
          fi
          got=$("smoke/$name/$exe" --version)
          case "$got" in
            "twaco $VERSION ("*")") ;;
            *) echo "the archived binary says '$got', expected 'twaco $VERSION (<commit> <date>)'" >&2; exit 1 ;;
          esac
          topics=$("smoke/$name/$exe" guide)
          for topic in workflow quirks service-code; do
            echo "$topics" | grep -q "^$topic " || { echo "guide topic $topic is missing from the archived binary" >&2; exit 1; }
          done

      # Windows: a per-user NSIS installer that adds twaco to PATH.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          }
          makensis /V2 "/DVERSION=$env:VERSION" `
            "/DEXE=$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release\twaco.exe" `
            "/DOUTFILE=$env:GITHUB_WORKSPACE\dist\twaco-$env:VERSION-x64-setup.exe" `
            packaging\windows\twaco.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, run and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\twaco"
          Start-Process -Wait -FilePath "dist\twaco-$env:VERSION-x64-setup.exe" -ArgumentList '/S'
          $got = & "$dir\twaco.exe" --version
          if ($got -notlike "twaco $env:VERSION (*)") { throw "the installed twaco says '$got'" }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -notcontains $dir) { throw "the installer did not add $dir to PATH: $path" }
          # _?= runs the uninstaller in place, so Start-Process waits for it.
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir"
          if (Test-Path "$dir\twaco.exe") { throw "the uninstaller left $dir\twaco.exe" }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -contains $dir) { throw "the uninstaller left $dir in PATH: $path" }
          # A PATH entry that was there before the install stays after the uninstall.
          $before = (Get-ItemProperty HKCU:\Environment).Path
          Set-ItemProperty HKCU:\Environment -Name Path -Value "$before;$dir" -Type ExpandString
          Start-Process -Wait -FilePath "dist\twaco-$env:VERSION-x64-setup.exe" -ArgumentList '/S'
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir"
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -notcontains $dir) { throw "the uninstaller removed a PATH entry it did not add: $path" }
          Set-ItemProperty HKCU:\Environment -Name Path -Value $before -Type ExpandString

      # macOS: an unsigned .pkg that installs /usr/local/bin/twaco.
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          pkg="dist/twaco-$VERSION-${{ matrix.target }}.pkg"
          packaging/macos/pkg.sh "$VERSION" "target/${{ matrix.target }}/release/twaco" "$pkg"
          payload=$(pkgutil --payload-files "$pkg" | sort | tr '\n' ' ')
          expected=". ./usr ./usr/local ./usr/local/bin ./usr/local/bin/twaco "
          [ "$payload" = "$expected" ] || { echo "unexpected payload: $payload" >&2; exit 1; }
          sudo installer -pkg "$pkg" -target /
          got=$(/usr/local/bin/twaco --version)
          case "$got" in
            "twaco $VERSION ("*")") ;;
            *) echo "the installed twaco says '$got'" >&2; exit 1 ;;
          esac

      # Linux: a .deb for /usr/bin, and an AppImage.
      - name: Installers (Linux)
        if: runner.os == 'Linux'
        run: |
          binary="target/${{ matrix.target }}/release/twaco"
          packaging/linux/deb.sh "$VERSION" "$binary" "dist/twaco_${VERSION}_amd64.deb"
          packaging/linux/appimage.sh "$binary" "dist/twaco-$VERSION-x86_64.AppImage"
      - name: Install, run and remove (Linux)
        if: runner.os == 'Linux'
        run: |
          check() {
            case "$1" in
              "twaco $VERSION ("*")") ;;
              *) echo "$2 says '$1'" >&2; exit 1 ;;
            esac
          }
          sudo apt-get install -y "./dist/twaco_${VERSION}_amd64.deb"
          check "$(/usr/bin/twaco --version)" "the .deb's twaco"
          sudo apt-get remove -y twaco
          chmod +x "dist/twaco-$VERSION-x86_64.AppImage"
          check "$(APPIMAGE_EXTRACT_AND_RUN=1 "dist/twaco-$VERSION-x86_64.AppImage" --version)" "the AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Every asset is here
        run: |
          for asset in \
            "twaco-$VERSION-x86_64-pc-windows-msvc.zip" \
            "twaco-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "twaco-$VERSION-aarch64-apple-darwin.tar.gz" \
            "twaco-$VERSION-x64-setup.exe" \
            "twaco-$VERSION-aarch64-apple-darwin.pkg" \
            "twaco_${VERSION}_amd64.deb" \
            "twaco-$VERSION-x86_64.AppImage"; do
            [ -f "dist/$asset" ] || { echo "no asset $asset" >&2; exit 1; }
          done

      # `twaco update` downloads an archive and accepts it only with a valid signature. The
      # trusted comment names the file, so an older signed archive cannot pass as this one.
      - name: Sign the archives
        env:
          SIGNING_KEY: ${{ secrets.TWACO_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "the TWACO_SIGNING_KEY secret is not set" >&2; exit 1; }
          sudo apt-get install -y minisign > /dev/null
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          public=$(sed -n 's/^pub const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' src/core/update.rs)
          for archive in dist/*.zip dist/*.tar.gz; do
            name=$(basename "$archive")
            minisign -S -s "$key" -m "$archive" -x "$archive.minisig" -t "file:$name" < /dev/null
            # The key twaco trusts must accept the signature.
            minisign -V -q -P "$public" -m "$archive" -x "$archive.minisig"
          done
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || index($0, "[") == 1) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "twaco $VERSION" > notes.md
      # The manifest `twaco update` reads: per target triple, its archive and signature. It is
      # signed too, so `twaco update` trusts only the versions and URLs that the key signed.
      - name: updater.json
        run: |
          python3 - <<'PY'
          import datetime, json, os
          version = os.environ["VERSION"]
          base = f"https://github.com/butteredstardust/twaco/releases/download/v{version}"
          archives = {
              "x86_64-pc-windows-msvc": "zip",
              "x86_64-unknown-linux-gnu": "tar.gz",
              "aarch64-apple-darwin": "tar.gz",
          }
          platforms = {}
          for target, extension in archives.items():
              name = f"twaco-{version}-{target}.{extension}"
              with open(f"dist/{name}.minisig") as signature:
                  platforms[target] = {"url": f"{base}/{name}", "signature": signature.read()}
          with open("notes.md") as notes:
              manifest = {
                  "version": version,
                  "notes": notes.read().strip(),
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
          with open("dist/updater.json", "w") as out:
              json.dump(manifest, out, indent=2)
              out.write("\n")
          PY
      - name: Sign updater.json
        env:
          SIGNING_KEY: ${{ secrets.TWACO_SIGNING_KEY }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          public=$(sed -n 's/^pub const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' src/core/update.rs)
          minisign -S -s "$key" -m dist/updater.json -x dist/updater.json.minisig -t "file:updater.json" < /dev/null
          minisign -V -q -P "$public" -m dist/updater.json -x dist/updater.json.minisig
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      # A fast-forward only: the push fails if main moved after prepare. The newer commit's run
      # then releases this version with it. A re-run after this step pushes nothing.
      - name: Fast-forward main to the version commit
        run: git push origin "$SHA:refs/heads/main"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ env.SHA }}
          name: twaco v${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
      - name: Remove the release branch
        run: |
          if git ls-remote --exit-code --heads origin "release/v$VERSION" > /dev/null; then
            git push origin --delete "release/v$VERSION"
          fi
