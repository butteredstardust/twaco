version: 1
rules: v1
page:
  name: Acme.BenchSpecN_MU
  template: blank
  data:
    documents: {service: Acme.BenchData.GetDocuments, on: load}
  slots:
    center:
      - toolbar:
          id: tools
          children:
            - button: {id: preview, label: Preview, variant: transparent, icon: 'cds:icon_view', enabled_when: documents_grid.selected}
            - button: {id: download, label: Download, variant: transparent, icon: 'cds:icon_download'}
      - grid:
          id: documents_grid
          data: documents
          props: {RowSelection: single}
          columns: [Title, FileName, Description, URL]
