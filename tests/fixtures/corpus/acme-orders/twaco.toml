# A small repository invented for twaco's own tests: every name is made up.
[solution]
name = "Acme.Orders"
src = "src"
dist = "dist"

[format]
indent_cdata_payload = false

[validate]
# The database Thing overrides an inherited service on purpose.
inherited_overrides = ["Acme.Orders.Database.GetDBInfo"]

[unused]
# The platform calls this Thing's GetDBInfo; nothing in the repository names it. The station is
# read by clients outside the repository.
keep = ["Acme.Orders.Database", "Acme.Orders.Station"]

[[project]]
name = "Acme.Orders"
root = "."

[gates]
# Acme.Orders.Dashboard is a minimal hand-written mashup, not an export: its content is no full
# mashup document, which the mashup content gate reports.
advisory = ["mashup content"]
