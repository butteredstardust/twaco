[package]
name = "twaco"
version = "0.1.6"
edition = "2021"
description = "Keep a ThingWorx solution in source control: service scripts as files, gates, safe deploys, and an MCP server for AI agents"
license = "MIT"
repository = "https://github.com/butteredstardust/twaco"
homepage = "https://github.com/butteredstardust/twaco"
readme = "README.md"
keywords = ["thingworx", "iot", "mcp", "cli", "devtools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "knowledge/**", "tests/**", "build.rs", "assets/icon/twaco.ico", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
dprint-plugin-typescript = "0.96"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4.2", features = ["platform-verifier"] }
sha2 = "0.11.0"
jiff = "0.2.37"
dirs = "7.0.0"
scraper = "0.27.0"
htmd = "0.5.5"
url = "2.5.8"
base64 = "0.23.1"
zip = "8.6.0"
ignore = "0.4.33"
swc_ecma_parser = "=27.0.7"
swc_common = "=17.0.1"
swc_ecma_ast = "=18.0.0"
swc_ecma_visit = "=18.0.1"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std", "preserve_order"] }
# `twaco update`: verify a release's signature, and unpack the binary from its archive.
minisign-verify = "0.3.0"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
# Diagnostic logs: see core::diagnostics. `tracing` is already in the tree through swc_common.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
indicatif = "0.18.6"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }

# Windows cannot rename over a running executable; this moves the old one aside first.
[target.'cfg(windows)'.dependencies]
self-replace = "1.5.0"

[features]
# Lets a test make the process abort at a named point of a transaction. Not part of any build
# that is shipped.
test-failpoints = []

# Embeds the icon and version information in twaco.exe. Build scripts run on the host, so only a
# Windows build pulls it in.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
proptest = "1.11.0"
jsonschema = { version = "=0.30.0", default-features = false }
roxmltree = "0.21.1"
tempfile = "3"

[profile.release]
strip = true
